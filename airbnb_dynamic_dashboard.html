function svgWrap(w,h,content){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="数据图表">${content}</svg>`}
function renderKpis(){let rows=selectedData(),vals=rows.map(x=>x.value),total=sum(vals),avg=average(vals),top=rows.slice().sort((a,b)=>b.value-a.value)[0],periodN=months().length;
let cards=[['所选指标合计',fmt(total,currentMetric().unit),'当前筛选范围','Σ'],['房源平均值',fmt(avg,currentMetric().unit),'按有数据的房源计算','◉'],['表现领先房源',top?top.name:'暂无数据',top?fmt(top.value,currentMetric().unit):'当前筛选无数据','↗'],['有效房源数',String(rows.length),'共 '+DATA.properties.length+' 个房源','⌂']];
$('kpis').innerHTML=cards.map((c,i)=>`<div class="kpi"><div class="kpi-icon">${c[3]}</div><div class="kpi-label">${c[0]}</div><div class="kpi-value" title="${c[1]}">${c[1]}</div><div class="kpi-sub">${c[2]}</div></div>`).join('')}
function renderBar(){let rows=selectedData().sort((a,b)=>a.value-b.value);if(!rows.length)return '<div class="empty">当前筛选没有可显示的数据</div>';let w=760,h=Math.max(300,rows.length*31+45),left=145,right=70,top=12,bottom=24,plotW=w-left-right,rowH=(h-top-bottom)/rows.length,max=Math.max(...rows.map(r=>r.value))*1.08;let s='';for(let i=0;i<=4;i++){let x=left+plotW*i/4;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${h-bottom}" stroke="#edf0f6"/><text x="${x}" y="${h-5}" fill="#8b95a8" font-size="10" text-anchor="middle">${short(max*i/4)}</text>`}
rows.forEach((r,i)=>{let y=top+i*rowH+rowH*.22,bh=Math.min(18,rowH*.57),bw=r.value/max*plotW;s+=`<text x="${left-12}" y="${y+bh*.85}" text-anchor="end" fill="#59657a" font-size="11">${esc(r.name)}</text><rect x="${left}" y="${y}" width="${plotW}" height="${bh}" rx="5" fill="#f1f3f9"/><rect x="${left}" y="${y}" width="${Math.max(1,bw)}" height="${bh}" rx="5" fill="${COLORS[DATA.properties.findIndex(p=>p.name===r.name)%COLORS.length]}" style="transform-origin:${left}px ${y+bh/2}px;animation:rise .5s ease both"/><text x="${Math.min(left+bw+8,w-4)}" y="${y+bh*.83}" fill="#455168" font-size="10">${short(r.value)}</text>`});return svgWrap(w,h,s)}
function renderLine(){let rows=monthTotals();if(!rows.length)return '<div class="empty">当前筛选没有可显示的趋势数据</div>';let w=520,h=310,l=48,r=18,t=20,b=48,pw=w-l-r,ph=h-t-b,max=Math.max(...rows.map(x=>x.value))*1.12||1,min=Math.min(0,...rows.map(x=>x.value));let s='';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4,y=t+ph-(v-min)/(max-min||1)*ph;s+=`<line x1="${l}" y1="${y}" x2="${w-r}" y2="${y}" stroke="#edf0f6"/><text x="${l-7}" y="${y+4}" text-anchor="end" fill="#8993a5" font-size="9">${short(v)}</text>`}
let pts=rows.map((o,i)=>({x:l+(rows.length===1?pw/2:pw*i/(rows.length-1)),y:t+ph-(o.value-min)/(max-min||1)*ph,...o}));if(pts.length>1){let d=pts.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ');s+=`<path d="${d}" fill="none" stroke="#5869e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="line-path"/>`;let area=d+` L ${pts[pts.length-1].x},${t+ph} L ${pts[0].x},${t+ph} Z`;s+=`<path d="${area}" fill="#5869e8" opacity=".08"/>`}
pts.forEach((p,i)=>{s+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="#5869e8" stroke-width="2"/><text x="${p.x}" y="${p.y-10}" text-anchor="middle" fill="#455168" font-size="9">${short(p.value)}</text><text x="${p.x}" y="${h-25}" text-anchor="middle" fill="#7f899d" font-size="9">${p.month.replace('年','/').replace('月','')}</text>`});return svgWrap(w,h,s)}
function renderPie(){let rows=selectedData().filter(x=>x.value>0).sort((a,b)=>b.value-a.value);if(!rows.length)return '<div class="empty">当前筛选没有可显示的占比数据</div>';let total=sum(rows.map(x=>x.value)),cx=170,cy=145,rad=98,angle=-Math.PI/2,s='';rows.forEach((o,i)=>{let da=o.value/total*Math.PI*2,ex=cx+rad*Math.cos(angle),ey=cy+rad*Math.sin(angle),nx=cx+rad*Math.cos(angle+da),ny=cy+rad*Math.sin(angle+da),large=da>Math.PI?1:0;let path=rows.length===1?`M ${cx} ${cy-rad} A ${rad} ${rad} 0 1 1 ${cx-0.01} ${cy-rad} Z`:`M ${cx} ${cy} L ${ex} ${ey} A ${rad} ${rad} 0 ${large} 1 ${nx} ${ny} Z`;s+=`<path d="${path}" fill="${COLORS[i%COLORS.length]}" stroke="#fff" stroke-width="2" opacity=".94"><title>${esc(o.name)}: ${fmt(o.value,currentMetric().unit)} (${(o.value/total*100).toFixed(1)}%)</title></path>`;angle+=da});s+=`<circle cx="${cx}" cy="${cy}" r="54" fill="#fff"/><text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#7e899c" font-size="11">总计</text><text x="${cx}" y="${cy+18}" text-anchor="middle" fill="#1c2940" font-size="15" font-weight="700">${short(total)}</text>`;
let legend=rows.slice(0,9).map((o,i)=>`<div style="display:flex;align-items:center;gap:7px;margin:10px 0;font-size:11px"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span><span style="flex:1;color:#5f6b80">${esc(o.name)}</span><b style="color:#354157">${(o.value/total*100).toFixed(1)}%</b></div>`).join('');if(rows.length>9)legend+=`<div style="font-size:10px;color:#8791a3">其余 ${rows.length-9} 个房源已合并省略</div>`;return `<div style="display:grid;grid-template-columns:minmax(190px,1fr) minmax(110px,.8fr);align-items:center;gap:5px">${svgWrap(340,290,s)}<div>${legend}</div></div>`}
function renderTable(){let rows=selectedData().sort((a,b)=>b.value-a.value),max=Math.max(1,...rows.map(r=>r.value));if(!rows.length){$('detailTable').innerHTML='<div class="empty">没有符合条件的数据</div>';return}$('detailTable').innerHTML=`<table><thead><tr><th>排名</th><th>民泊名称</th><th class="num">当前指标值</th><th style="min-width:160px">相对表现</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(r.name)}</td><td class="num"><b>${fmt(r.value,currentMetric().unit)}</b></td><td><div class="barmini"><span style="width:${r.value/max*100}%"></span></div></td></tr>`).join('')}</tbody></table>`}
function rangeIndices(startId,endId){let ms=months(),a=ms.indexOf($(startId).value),b=ms.indexOf($(endId).value);if(a<0)a=0;if(b<0)b=ms.length-1;if(a>b){let t=a;a=b;b=t}return Array.from({length:b-a+1},(_,i)=>a+i)}
function rangeValue(p,idxs){let vals=idxs.map(i=>(p.metrics[activeMetric]||[])[i]).filter(v=>v!=null&&Number.isFinite(v));if(!vals.length)return null;let k=activeMetric;return ['avgNights','perNight','perGuest'].includes(k)?average(vals):sum(vals)}
function compareRows(){let ai=rangeIndices('compareAStart','compareAEnd'),bi=rangeIndices('compareBStart','compareBEnd');return propList().map(p=>({name:p.name,a:rangeValue(p,ai),b:rangeValue(p,bi)})).filter(x=>x.a!=null||x.b!=null).map(x=>({...x,delta:x.a!=null&&x.b!=null?x.b-x.a:null,pct:x.a!=null&&x.b!=null&&x.a!==0?(x.b-x.a)/Math.abs(x.a)*100:null}))}
function renderComparison(){if(!$('compareChart'))return;let m=currentMetric(),ms=months(),ai=rangeIndices('compareAStart','compareAEnd'),bi=rangeIndices('compareBStart','compareBEnd');$('compareALabel').textContent=ms[ai[0]]+' — '+ms[ai[ai.length-1]];$('compareBLabel').textContent=ms[bi[0]]+' — '+ms[bi[bi.length-1]];let rows=compareRows(),aTotal=sum(rows.map(x=>x.a)),bTotal=sum(rows.map(x=>x.b)),aAvg=average(rows.map(x=>x.a)),bAvg=average(rows.map(x=>x.b)),delta=aTotal!=null&&bTotal!=null?bTotal-aTotal:null,pct=aTotal!=null&&bTotal!=null&&aTotal!==0?(bTotal-aTotal)/Math.abs(aTotal)*100:null;let cards=[['区间 A 合计/均值',fmt(aTotal,m.unit),$('compareALabel').textContent],['区间 B 合计/均值',fmt(bTotal,m.unit),$('compareBLabel').textContent],['变化幅度',delta==null?'—':(delta>0?'+':'')+fmt(delta,m.unit),pct==null?'无法计算基准变化率':(pct>0?'+':'')+pct.toFixed(1)+'%']];$('compareKpis').innerHTML=cards.map((c,i)=>`<div class="compare-kpi"><div class="klabel">${c[0]}</div><div class="kvalue" style="color:${i===2?(pct==null?'#526078':pct>=0?'#199b78':'#d45b70'):'#1d2940'}">${c[1]}</div><div class="ksub">${c[2]}</div></div>`).join('');if(!rows.length){$('compareChart').innerHTML='<div class="empty">当前筛选没有可比较的数据</div>';$('compareTable').innerHTML='';return}let sorted=rows.slice().sort((x,y)=>Math.max(y.a||0,y.b||0)-Math.max(x.a||0,x.b||0)),max=Math.max(1,...sorted.flatMap(x=>[x.a||0,x.b||0]))*1.08,w=900,h=Math.max(260,sorted.length*43+48),l=160,r=90,top=15,bottom=30,pw=w-l-r,rh=(h-top-bottom)/sorted.length,s='';for(let i=0;i<=4;i++){let x=l+pw*i/4;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${h-bottom}" stroke="#edf0f6"/><text x="${x}" y="${h-8}" text-anchor="middle" fill="#8993a5" font-size="10">${short(max*i/4)}</text>`}sorted.forEach((o,i)=>{let y=top+i*rh+rh*.16,bh=Math.min(12,rh*.28),wa=(o.a||0)/max*pw,wb=(o.b||0)/max*pw;s+=`<text x="${l-12}" y="${y+bh+3}" text-anchor="end" fill="#59657a" font-size="11">${esc(o.name)}</text><rect x="${l}" y="${y}" width="${Math.max(0,wa)}" height="${bh}" rx="4" fill="#5869e8"><title>区间A ${fmt(o.a,m.unit)}</title></rect><rect x="${l}" y="${y+bh+4}" width="${Math.max(0,wb)}" height="${bh}" rx="4" fill="#27a98a"><title>区间B ${fmt(o.b,m.unit)}</title></rect>`});$('compareChart').innerHTML=svgWrap(w,h,s);$('compareTable').innerHTML=`<table><thead><tr><th>民泊名称</th><th class="num">区间 A</th><th class="num">区间 B</th><th class="num">差额（B−A）</th><th class="num">变化率</th></tr></thead><tbody>${rows.slice().sort((x,y)=>(y.b??-Infinity)-(x.b??-Infinity)).map(o=>`<tr><td>${esc(o.name)}</td><td class="num">${fmt(o.a,m.unit)}</td><td class="num">${fmt(o.b,m.unit)}</td><td class="num">${o.delta==null?'—':(o.delta>0?'+':'')+fmt(o.delta,m.unit)}</td><td class="num" style="color:${o.pct==null?'#7b879a':o.pct>=0?'#199b78':'#d45b70'}">${o.pct==null?'—':(o.pct>0?'+':'')+o.pct.toFixed(1)+'%'}</td></tr>`).join('')}</tbody></table>`}
function render(){let m=currentMetric();$('periodLabel').textContent=activePeriod==='all'?'全部可用月份':activePeriod;$('mainTitle').textContent=m.label+' · 房源对比';$('mainSub').textContent=(activePeriod==='all'?'按所有可用月份汇总':'仅显示 '+activePeriod)+' · 单位：'+m.unit;$('chartTag').textContent=activeChart==='pie'?'PIE CHART':activeChart==='line'?'TREND LINE':'BAR CHART';renderKpis();$('mainChart').innerHTML=activeChart==='pie'?renderPie():activeChart==='line'?renderLine():renderBar();$('mainLegend').innerHTML=activeChart==='bar'?'<span class="legend-item"><span class="dot" style="background:#5869e8"></span>条形长度代表指标值</span>':'<span class="legend-item"><span class="dot" style="background:#5869e8"></span>'+m.label+'</span>';renderTrend();renderTable();renderComparison()}
function renderTrend(){let old=activeChart;activeChart='line';$('trendChart').innerHTML=renderLine();activeChart=old}
function short(v){if(v==null)return '—';let a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1)+'M';if(a>=1e4)return (v/1e3).toFixed(0)+'k';if(a>=1e3)return (v/1e3).toFixed(1)+'k';return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:1})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
setup();
</script></body></html>
